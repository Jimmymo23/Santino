<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Santino</title>
<style>
  :root {
    --bg:#05080c; --panel:rgba(12,22,30,.72); --line:rgba(79,227,255,.18); --line2:rgba(79,227,255,.42);
    --text:#d7ecf5; --dim:#5f8496; --cy:#4fe3ff; --amber:#ffb547; --red:#ff5d5d; --ok:#5dffb0;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(79,227,255,.10), transparent 70%),
      linear-gradient(rgba(79,227,255,.035) 1px, transparent 1px) 0 0/100% 32px,
      linear-gradient(90deg, rgba(79,227,255,.035) 1px, transparent 1px) 0 0/32px 100%,
      var(--bg);
    color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  button { font:inherit; color:inherit; cursor:pointer; }
  [hidden] { display:none !important; }
  .lbl { font:600 10.5px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }

  #app { height:100%; display:grid; grid-template-rows:auto auto 1fr auto auto; }
  .strip { display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid var(--line); }
  .brand { font:700 14px/1 var(--mono); letter-spacing:.34em; color:var(--cy); text-shadow:0 0 12px rgba(79,227,255,.6); }
  .links { display:flex; gap:10px; margin-inline-start:auto; }
  .link { display:flex; align-items:center; gap:5px; background:none; border:0; padding:0; }
  .dot { width:7px; height:7px; border-radius:50%; background:#33464f; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #clock { font:600 12px/1 var(--mono); color:var(--text); letter-spacing:.08em; }
  #speak { background:none; border:1px solid var(--line); border-radius:6px; padding:5px 7px; font-size:13px; line-height:1; }

  .deck { display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .corewrap { position:relative; flex:none; width:118px; height:118px; background:none; border:0; padding:0; border-radius:50%; }
  #core { width:100%; height:100%; display:block; }
  #state { position:absolute; left:0; right:0; bottom:-4px; text-align:center; color:var(--cy); }
  .tiles { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; min-width:0; }
  .tile { background:var(--panel); border:1px solid var(--line); padding:7px 8px 6px; position:relative; clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%); }
  .tile b { display:block; font:700 20px/1.1 var(--mono); color:var(--cy); font-variant-numeric:tabular-nums; }
  .tile .lbl { font-size:8.5px; letter-spacing:.1em; }
  .tile.warn b { color:var(--red); text-shadow:0 0 10px rgba(255,93,93,.5); }
  .tile.act b { color:var(--amber); text-shadow:0 0 10px rgba(255,181,71,.5); }

  #log { overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; min-height:0; }
  .msg { max-width:92%; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg .lbl { display:block; margin-bottom:5px; }
  .user { align-self:flex-end; text-align:start; border-inline-end:2px solid var(--dim); padding-inline-end:10px; color:#a9c3cf; }
  .user .lbl { text-align:end; }
  .assistant { align-self:flex-start; border-inline-start:2px solid var(--cy); padding-inline-start:12px; }
  .assistant .lbl { color:var(--cy); }
  .brief { align-self:stretch; max-width:none; background:var(--panel); border:1px solid var(--line2); border-inline-start:2px solid var(--cy); padding:12px 14px; box-shadow:0 0 24px rgba(79,227,255,.08) inset; }
  .note { align-self:center; text-align:center; font:500 11px/1.4 var(--mono); letter-spacing:.08em; color:var(--dim); }
  .card { align-self:stretch; background:rgba(40,26,6,.55); border:1px solid rgba(255,181,71,.55); padding:12px 14px; box-shadow:0 0 22px rgba(255,181,71,.10); }
  .card .lbl { color:var(--amber); }
  .card .sum { margin:8px 0 12px; overflow-wrap:anywhere; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; padding:11px; font:700 12px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; border:1px solid; background:none; }
  .yes { color:var(--ok); border-color:var(--ok) !important; background:rgba(93,255,176,.08) !important; }
  .nope { color:var(--red); border-color:rgba(255,93,93,.5) !important; }
  .ping { align-self:stretch; display:flex; gap:10px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); padding:10px 12px; }
  .ping button { background:none; border:0; color:var(--dim); margin-inline-start:auto; }

  .chips { display:flex; gap:8px; overflow-x:auto; padding:8px 16px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button { flex:none; background:none; border:1px solid var(--line2); color:var(--cy); padding:7px 12px; font:600 11px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; }
  footer { border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid var(--line); padding:11px 12px; font:inherit; max-height:120px; border-radius:0; }
  .sq { width:46px; height:46px; flex:none; border:1px solid var(--line2); background:var(--panel); color:var(--cy); font-size:18px; }
  #mic.rec { border-color:var(--red); color:var(--red); box-shadow:0 0 18px rgba(255,93,93,.4); }
  #mic:disabled { opacity:.35; }
  textarea:focus, button:focus-visible, input:focus { outline:1px solid var(--cy); outline-offset:2px; }

  #login { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; z-index:5; }
  #login .brand { font-size:22px; }
  #login input { width:min(320px,100%); background:var(--panel); color:var(--text); border:1px solid var(--line2); padding:12px 14px; font:inherit; text-align:center; letter-spacing:.2em; }
  #login button { width:min(320px,100%); background:rgba(79,227,255,.1); color:var(--cy); border:1px solid var(--cy); padding:12px; font:700 12px/1 var(--mono); letter-spacing:.2em; }

  @media (min-width:900px) {
    #app { grid-template-columns:360px 1fr; grid-template-rows:auto 1fr auto auto; }
    .strip { grid-column:1 / -1; }
    .deck { grid-row:2 / -1; flex-direction:column; justify-content:center; gap:34px; border-bottom:0; border-inline-end:1px solid var(--line); padding:24px; }
    .corewrap { width:250px; height:250px; }
    #state { bottom:-18px; }
    .tiles { flex:none; width:100%; grid-template-columns:repeat(2,1fr); gap:10px; }
    .tile { padding:12px 14px; } .tile b { font-size:30px; } .tile .lbl { font-size:10px; }
    #log { padding:24px 32px; } .msg { max-width:70ch; }
    .chips, footer { padding-inline:32px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="strip">
    <div class="brand">SANTINO</div>
    <div class="links">
      <button class="link lbl" id="lGoogle" title="Google"><i class="dot"></i>GGL</button>
      <span class="link lbl" title="WhatsApp"><i class="dot" id="dWa"></i>WA</span>
      <span class="link lbl" title="Voice"><i class="dot" id="dVox"></i>VOX</span>
    </div>
    <div id="clock">--:--</div>
    <button id="speak" aria-pressed="true" aria-label="Spoken replies">🔊</button>
  </header>

  <section class="deck">
    <button class="corewrap" id="coreBtn" aria-label="Talk to Santino">
      <canvas id="core"></canvas>
      <div class="lbl" id="state">STANDBY</div>
    </button>
    <div class="tiles">
      <div class="tile" id="tOpen"><b>–</b><span class="lbl">Open</span></div>
      <div class="tile" id="tOver"><b>–</b><span class="lbl">Overdue</span></div>
      <div class="tile" id="tToday"><b>–</b><span class="lbl">Today</span></div>
      <div class="tile" id="tMeet"><b>–</b><span class="lbl">Meetings</span></div>
      <div class="tile" id="tMail"><b>–</b><span class="lbl">Unread</span></div>
      <div class="tile" id="tAppr"><b>–</b><span class="lbl">Approve</span></div>
    </div>
  </section>

  <main id="log" aria-live="polite"></main>

  <div class="chips">
    <button data-say="Brief me.">Brief me</button>
    <button data-say="What does my day look like?">My day</button>
    <button data-say="Team status: who is working on what, and what is late?">Team status</button>
    <button data-say="Summarize my unread email and tell me what needs a reply.">Inbox</button>
    <button data-say="Help me plan my week.">Plan my week</button>
  </div>

  <footer>
    <button class="sq" id="mic" aria-label="Record voice">🎙</button>
    <textarea id="text" rows="1" dir="auto" placeholder="اتكلم أو اكتب… / Talk or type…"></textarea>
    <button class="sq" id="send" aria-label="Send">➤</button>
  </footer>
</div>

<form id="login" hidden>
  <div class="brand">SANTINO</div>
  <div class="lbl">Identity check</div>
  <input id="pass" type="password" placeholder="PASSCODE" autocomplete="current-password" required>
  <button>AUTHORIZE</button>
  <div class="note" id="loginErr"></div>
</form>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), text = $("text"), mic = $("mic");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let token = null, speakOn = true, owner = "";
try { token = localStorage.getItem("santino_token"); speakOn = localStorage.getItem("santino_speak") !== "0"; } catch {}
const shown = new Set();

// ---------- core: reacts to idle / listening / thinking / speaking ----------
const core = $("core"), cx = core.getContext("2d");
let mode = "idle", level = 0, analyser = null, buf = null;
const LABEL = { idle: "STANDBY", listening: "LISTENING", thinking: "PROCESSING", speaking: "SPEAKING" };
function setMode(m) { mode = m; $("state").textContent = LABEL[m]; if (calm) draw(0); }
function draw(t) {
  const d = Math.min(devicePixelRatio || 1, 2), w = core.clientWidth * d;
  if (core.width !== w) core.width = core.height = w;
  const c = w / 2, R = w / 2 - 2 * d, s = t / 1000;
  if (mode === "listening" && analyser) {
    analyser.getByteTimeDomainData(buf);
    let sum = 0; for (const v of buf) sum += (v - 128) ** 2;
    level += (Math.min(1, Math.sqrt(sum / buf.length) / 40) - level) * .35;
  } else if (mode === "speaking") level += ((.35 + .3 * Math.sin(s * 9) * Math.sin(s * 2.3)) - level) * .2;
  else if (mode === "thinking") level += (.25 - level) * .1;
  else level += ((.06 + .04 * Math.sin(s * 1.4)) - level) * .08;
  const hot = mode === "listening" ? "255,93,93" : "79,227,255";
  const spin = mode === "thinking" ? 3.2 : mode === "idle" ? .25 : .9;
  cx.clearRect(0, 0, w, w);
  cx.lineCap = "butt";
  // tick ring
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * Math.PI * 2, wob = Math.sin(i * .7 + s * 5) * .5 + .5;
    const len = R * (.05 + level * .22 * wob);
    cx.strokeStyle = `rgba(${hot},${.25 + level * .6})`; cx.lineWidth = 1.2 * d;
    cx.beginPath(); cx.moveTo(c + Math.cos(a) * (R - len), c + Math.sin(a) * (R - len)); cx.lineTo(c + Math.cos(a) * R, c + Math.sin(a) * R); cx.stroke();
  }
  // segmented arcs
  [[.78, 1, 3, .9], [.64, -1.6, 4, .55], [.50, 2.3, 2, .75]].forEach(([r, dir, segs, alpha], k) => {
    cx.strokeStyle = `rgba(${hot},${alpha})`; cx.lineWidth = (k === 0 ? 2.4 : 1.4) * d;
    for (let j = 0; j < segs; j++) {
      const a0 = s * spin * dir + (j / segs) * Math.PI * 2;
      cx.beginPath(); cx.arc(c, c, R * r, a0, a0 + (Math.PI * 2 / segs) * .68); cx.stroke();
    }
  });
  // heart
  const hr = R * (.2 + level * .16), g = cx.createRadialGradient(c, c, 0, c, c, hr * 1.9);
  g.addColorStop(0, `rgba(${hot},.95)`); g.addColorStop(.45, `rgba(${hot},.35)`); g.addColorStop(1, `rgba(${hot},0)`);
  cx.fillStyle = g; cx.beginPath(); cx.arc(c, c, hr * 1.9, 0, Math.PI * 2); cx.fill();
  if (!calm) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---------- plumbing ----------
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { authorization: "Bearer " + token, ...(opts.headers || {}) } });
  if (res.status === 401) { showLogin(); throw new Error("Authorization required"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}
const down = () => { log.scrollTop = log.scrollHeight; };
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function note(t) { const e = el("div", "note", t); log.appendChild(e); down(); return e; }

function bubble(role, content, { type = false, label, cls = "" } = {}) {
  const box = el("div", `msg ${role} ${cls}`);
  box.appendChild(el("span", "lbl", label || (role === "user" ? "You" : "Santino")));
  const body = el("div"); body.dir = "auto"; box.appendChild(body); log.appendChild(box);
  if (!type || calm) { body.textContent = content; down(); return; }
  let i = 0; const step = Math.max(1, Math.round(content.length / 90));
  (function tick() { i += step; body.textContent = content.slice(0, i); down(); if (i < content.length) setTimeout(tick, 16); })();
}

function say(t) {
  if (!speakOn || !("speechSynthesis" in window)) { setMode("idle"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/•/g, ""));
  u.lang = /[؀-ۿ]/.test(t) ? "ar-EG" : "en-US";
  u.onstart = () => setMode("speaking"); u.onend = u.onerror = () => setMode("idle");
  speechSynthesis.speak(u);
}

async function send(msg) {
  msg = msg.trim(); if (!msg) return;
  bubble("user", msg); setMode("thinking");
  try {
    const { reply } = await api("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: msg }) });
    bubble("assistant", reply, { type: true, cls: reply.includes("•") ? "brief" : "" }); say(reply);
  } catch (e) { note(e.message); setMode("idle"); }
  pollInbox(); pollDash();
}

function approvalCard(a) {
  const card = el("div", "card");
  const row = el("div", "row");
  const mk = (label, cls, action) => {
    const b = el("button", cls, label);
    b.onclick = async () => {
      row.querySelectorAll("button").forEach((x) => (x.disabled = true));
      let msg; try { msg = (await api(`/api/approvals/${a.id}/${action}`, { method: "POST" })).message; } catch (e) { msg = e.message; }
      row.replaceWith(el("div", "note", msg)); pollDash();
    };
    return b;
  };
  row.append(mk("Authorize", "yes", "approve"), mk("Deny", "nope", "reject"));
  const body = el("div", "sum");
  for (const line of a.summary.split("\n")) { const d = el("div", "", line || "\u00a0"); d.dir = "auto"; body.appendChild(d); }
  card.append(el("span", "lbl", "Authorization required"), body, row);
  log.appendChild(card); down();
}

function ping(n) {
  if (n.kind === "brief") {
    bubble("assistant", n.text, { type: true, label: "Morning brief", cls: "brief" }); say(n.text);
    api(`/api/notifications/${n.id}/read`, { method: "POST" }).catch(() => {});
    return;
  }
  const p = el("div", "ping"); p.dir = "auto";
  const x = el("button", "", "✕"); x.setAttribute("aria-label", "Dismiss");
  x.onclick = () => { p.remove(); api(`/api/notifications/${n.id}/read`, { method: "POST" }).catch(() => {}); };
  p.append(el("div", "", (n.kind === "reminder" ? "⏰ " : n.kind === "whatsapp" ? "💬 " : "📌 ") + n.text), x);
  log.appendChild(p); down();
  if (n.kind === "reminder") say(n.text);
}

async function pollInbox() {
  if (!token) return;
  try {
    const { approvals, notifications } = await api("/api/inbox");
    for (const a of approvals) if (!shown.has("a" + a.id)) { shown.add("a" + a.id); approvalCard(a); }
    for (const n of notifications) if (!shown.has("n" + n.id)) { shown.add("n" + n.id); ping(n); }
  } catch {}
}

function tile(id, v, cls) { const t = $(id); t.querySelector("b").textContent = v == null ? "–" : v; t.classList.toggle(cls || "x", Boolean(cls) && v > 0); }
async function pollDash() {
  if (!token) return;
  try {
    const d = await api("/api/dashboard");
    tile("tOpen", d.open); tile("tOver", d.overdue, "warn"); tile("tToday", d.due_today);
    tile("tMeet", d.meetings); tile("tMail", d.unread); tile("tAppr", d.approvals, "act");
  } catch {}
}

function tickClock() {
  $("clock").textContent = new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Cairo", hour: "2-digit", minute: "2-digit" }).format(new Date());
}

// ---------- voice: tap the core or the mic to start, tap again to stop ----------
let rec = null, chunks = [], actx = null;
async function toggleMic() {
  if (mic.disabled) { note("VOICE LINK OFFLINE — TYPE INSTEAD"); return; }
  if (rec) { rec.stop(); return; }
  try {
    speechSynthesis.cancel();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser(); analyser.fftSize = 512; buf = new Uint8Array(analyser.fftSize);
    actx.createMediaStreamSource(stream).connect(analyser);
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop()); actx.close(); analyser = null;
      const blob = new Blob(chunks, { type: rec.mimeType }); rec = null; mic.classList.remove("rec"); setMode("thinking");
      try {
        const { text: heard } = await api("/api/transcribe", { method: "POST", headers: { "content-type": blob.type }, body: blob });
        if (heard) send(heard); else { note("DIDN'T CATCH THAT"); setMode("idle"); }
      } catch (e) { note(e.message); setMode("idle"); }
    };
    rec.start(); mic.classList.add("rec"); setMode("listening");
  } catch { note("MICROPHONE PERMISSION NEEDED"); }
}
mic.onclick = toggleMic; $("coreBtn").onclick = toggleMic;

$("send").onclick = () => { send(text.value); text.value = ""; text.style.height = "auto"; };
text.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); } });
text.addEventListener("input", () => { text.style.height = "auto"; text.style.height = text.scrollHeight + "px"; });
document.querySelectorAll(".chips button").forEach((b) => (b.onclick = () => send(b.dataset.say)));

const speakBtn = $("speak");
const paintSpeak = () => { speakBtn.textContent = speakOn ? "🔊" : "🔇"; speakBtn.setAttribute("aria-pressed", speakOn); };
speakBtn.onclick = () => { speakOn = !speakOn; try { localStorage.setItem("santino_speak", speakOn ? "1" : "0"); } catch {} if (!speakOn) { speechSynthesis.cancel(); setMode("idle"); } paintSpeak(); };
paintSpeak();

$("lGoogle").onclick = async () => {
  if ($("lGoogle").querySelector(".dot").classList.contains("on")) return;
  try { const { url } = await api("/api/google/connect"); location.href = url; } catch (e) { note(e.message); }
};

function showLogin() { token = null; try { localStorage.removeItem("santino_token"); } catch {} $("login").hidden = false; }
$("login").onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ passcode: $("pass").value }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { $("loginErr").textContent = data.error || "ACCESS DENIED"; return; }
  token = data.token; try { localStorage.setItem("santino_token", token); } catch {}
  $("login").hidden = true; start();
};

async function start() {
  try {
    const [{ messages }, status] = await Promise.all([api("/api/history"), api("/api/status")]);
    owner = status.owner || "";
    log.textContent = "";
    for (const m of messages) bubble(m.role, m.content, { cls: m.role === "assistant" && m.content.includes("•") ? "brief" : "" });
    $("lGoogle").querySelector(".dot").classList.toggle("on", status.google);
    $("dWa").classList.toggle("on", status.whatsapp); $("dVox").classList.toggle("on", status.voice);
    mic.disabled = !status.voice;
    const h = Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Cairo", hour: "2-digit", hour12: false }).format(new Date()));
    note(`SYSTEMS ONLINE · GOOD ${h >= 5 && h < 12 ? "MORNING" : h >= 12 && h < 18 ? "AFTERNOON" : "EVENING"}${owner ? ", " + owner.toUpperCase() : ""}`);
    if (!status.google) note("GOOGLE NOT LINKED · TAP GGL TO CONNECT");
    pollInbox(); pollDash();
  } catch {}
}

tickClock(); setInterval(tickClock, 15000);
if (token) start(); else showLogin();
setInterval(pollInbox, 20000); setInterval(pollDash, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pollInbox(); pollDash(); } });
</script>
</body>
</html>
