name = "santino"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "santino"
database_id = "4cd06d64-1430-42ce-b9c7-5a4eb13b3e27"
migrations_dir = "migrations"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_URL = "https://santino.mohamed-gsmart.workers.dev"
OWNER_NAME = "Jimmy"
TIMEZONE = "Africa/Cairo"
BRIEF_HOUR = "8"
REPLY_LANGUAGE = "English"
TTS_MODEL = "@cf/deepgram/aura-2-en"
# TTS_VOICE = ""   # optional speaker name; empty = the model's default voice
CLAUDE_MODEL = "claude-sonnet-5-5"
WHATSAPP_API_VERSION = "v21.0"
